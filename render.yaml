# Render Blueprint: New + -> Blueprint -> pick this repo. Free web service (512 MB, sleeps after 15 min idle).
services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FINN_AR_MAX_PAGES
        value: "60"            # annual-report pages read for research (company overview, segments, letters)
      - key: FINN_REFRESH_MINUTES
        value: "10"            # background refresh while the server is awake
      - key: FINN_HISTORY_YEARS
        value: "10"            # long price history fetched in the background after every start (rank + backtest)
      - key: INGEST_SHARED_SECRET
        generateValue: true    # Render generates a random value; protects /jobs/* (never committed)
      - key: GROQ_API_KEY
        sync: false            # you paste the value in Render's dashboard; never committed
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
