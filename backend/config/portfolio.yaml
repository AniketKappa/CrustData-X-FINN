# Demo portfolio (owner request 30 Oct 2026, D-54): 20 holdings chosen so that, in a normal week, the briefing
# has something in every alert type: results, management change, M&A, litigation/regulatory, credit rating and
# price/volume moves. These are DEMO CHOICES: the app's Portfolio tab adds or removes any NSE/BSE stock, and the
# edited list is saved to data/portfolio.json (which then takes precedence over this file).
# bse_code values need Spike S5 verification. `aliases` map RSS company names to symbols.
# `news_terms`: a headline must contain one of these (whole words) to count as about the company; a term starting
# with "=" is matched case-sensitively. `news_exclude`: headlines naming these are not attached.
holdings:
  - {symbol: RELIANCE,   bse_code: "500325", name: Reliance Industries Ltd,  sector: Energy & conglomerate, size: large, aliases: [Reliance Industries], news_terms: [Reliance Industries, RIL], news_exclude: [Reliance Power, Reliance Infrastructure, Reliance Capital]}
